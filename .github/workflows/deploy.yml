name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set as a repo Variable (Settings -> Secrets and variables ->
          # Actions -> Variables) once the Cloudflare Worker proxy is
          # deployed, e.g. https://ops-opensky-proxy.<subdomain>.workers.dev
          # Left unset, live flight tracking falls back to simulated traffic.
          VITE_OPENSKY_PROXY_URL: ${{ vars.OPENSKY_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
